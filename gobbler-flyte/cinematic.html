<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Gobbler.flyte Mission Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../vendor/x_ite/x_ite.css"><script src="../vendor/x_ite/x_ite.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#02030a;color:#eaf0ff;font:14px/1.4 system-ui,-apple-system,sans-serif;overflow:hidden}
x3d-canvas{position:fixed;inset:0;width:100%;height:100%;filter:saturate(1.12) contrast(1.04)}
#grade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(1,2,10,.62) 100%),linear-gradient(#02030a 0,transparent 9%,transparent 88%,#02030a 100%)}
#title{position:fixed;left:28px;top:22px;pointer-events:none;text-shadow:0 0 24px #000}
#title h1{margin:0;font-size:30px;letter-spacing:.22em;font-weight:700;background:linear-gradient(90deg,#ffd27a,#ff7a59,#f04fbf,#7a8cff,#4fe0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#title p{margin:4px 0 0;letter-spacing:.32em;font-size:12px;color:#b9c6f0;text-transform:uppercase}
#chips{position:fixed;left:28px;right:28px;bottom:44px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:rgba(8,12,30,.5);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:999px;padding:5px 12px;font-size:12px;letter-spacing:.04em;color:#fff;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 0 18px -6px var(--c);font:inherit}
.chip b{color:var(--c);font-variant-numeric:tabular-nums}.chip:hover{box-shadow:0 0 26px -2px var(--c)}
.chip.nav{border-color:#56608f;color:#cfd8ff}
#card{position:fixed;right:28px;top:24px;width:250px;background:rgba(8,12,30,.66);border:1px solid var(--c,#56608f);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);box-shadow:0 0 40px -12px var(--c,#000);display:none}
#card h2{margin:0 0 8px;font-size:18px;letter-spacing:.08em;color:var(--c)}#card dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 10px}#card dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
#note{position:fixed;left:0;right:0;bottom:12px;opacity:.75;text-align:center;font-size:11px;letter-spacing:.12em;color:#8b97c4;text-transform:uppercase}
</style></head><body>
<x3d-canvas id="world" splashScreen="false" notifications="false" contentScale="auto"></x3d-canvas>
<div id="grade"></div>
<div id="title"><h1>GOBBLER.FLYTE</h1><p>Mission control · nine flywheels · one appetite</p></div>
<div id="card"><h2></h2><dl></dl></div>
<div id="chips"><button id="sound" class="chip nav">♪ Sound off</button></div>
<div id="note">An art piece · every figure on this page is synthetic</div>
<script type="module">
const $=s=>document.querySelector(s), st=window.__mc={errors:[]};
try{
  const browser=X3D.getBrowser($("#world")), data=await (await fetch("data.json")).json();
  await browser.loadURL(new X3D.MFString("scene.x3d")); const scene=browser.currentScene;
  const rgb=c=>`rgb(${c.map(x=>Math.round(255*x)).join(",")})`, t0=performance.now();
  const bind=n=>{scene.getNamedNode(n).set_bind=true};
  const show=w=>{const c=$("#card"); if(!w){c.style.display="none";return} c.style.display="block"; c.style.setProperty("--c",rgb(w.color)); c.querySelector("h2").textContent=w.name.toUpperCase();
    const dl=c.querySelector("dl"); dl.replaceChildren(); for(const [k,v] of [["momentum",Math.round(w.momentum*100)+"%"],["worlds woven",w.worlds],["receipts",w.receipts],["one turn",w.period+" s"]]){const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=k;dd.textContent=v;dl.append(dt,dd)}};
  for(const [n,label] of data.views.slice(0,3)){const b=document.createElement("button");b.className="chip nav";b.textContent=label;b.onclick=()=>{bind(n);show(null)};$("#chips").append(b)}
  data.wheels.forEach((w,i)=>{const b=document.createElement("button");b.className="chip";b.style.setProperty("--c",rgb(w.color));const n=document.createElement("b");b.append(w.name+" ",n);
    b.onclick=()=>{bind("V"+i);show(w)};$("#chips").append(b);w.el=n;
    scene.getNamedNode("TS"+i).addFieldCallback("mc","touchTime",()=>{try{bind("V"+i);show(w)}catch(e){st.errors.push(String(e))}})});
  setInterval(()=>{const s=(performance.now()-t0)/1000;for(const w of data.wheels)w.el.textContent=(w.turns+Math.floor(s/w.period)).toLocaleString()},500);
  // sound: the loop is decoded to samples so it repeats without a gap; starting it restarts the scene's clocks with it
  let ctx=null, src=null, buf=null;
  const SYNC=["T_beat","T_shock","T_tour","T_pulse","T_fan","T_bolt","T_hue"];
  $("#sound").onclick=async()=>{try{
    if(src){src.stop();src=null;$("#sound").textContent="♪ Sound off";st.playing=false;return}
    $("#sound").textContent="♪ loading";
    ctx=ctx||new AudioContext(); await ctx.resume();
    buf=buf||await ctx.decodeAudioData(await (await fetch("loop.wav")).arrayBuffer());
    const clock=()=>Date.now()/1000;  // X3D time is seconds since 1970; X_ITE has no browser.currentTime
    const now=clock(); for(const n of SYNC) scene.getNamedNode(n).stopTime=now;
    setTimeout(()=>{const t=clock()+0.12; for(const n of SYNC) scene.getNamedNode(n).startTime=t;
      const g=ctx.createGain(); g.gain.value=0.9; g.connect(ctx.destination);
      src=ctx.createBufferSource(); src.buffer=buf; src.loop=true; src.connect(g); src.start(ctx.currentTime+0.12);
      scene.getNamedNode("V_tour").set_bind=true; st.playing=true; st.seconds=buf.duration; $("#sound").textContent="♪ Sound on"},150);
  }catch(e){st.errors.push(String(e));$("#sound").textContent="♪ failed"}};
  st.ready=true;
}catch(e){st.errors.push(String(e));console.error(e)}
</script></body></html>
